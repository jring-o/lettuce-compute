[package]
name = "lettuce-compute-desktop"
version = "2.0.1"
description = "Lettuce Compute Desktop App"
authors = ["Lettuce Contributors"]
edition = "2021"

[lib]
name = "lettuce_compute_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lettuce-compute-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
http = "1"
percent-encoding = "2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
